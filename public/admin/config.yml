backend:
  name: github
  repo: IEADESPA/site
  branch: main
  # Sem base_url nem auth_endpoint: o Sveltia CMS faz login com um Personal
  # Access Token do GitHub (botão "Sign In with Token" na tela de login),
  # sem precisar de nenhum servidor de autenticação próprio.

locale: "pt"

# Fallback: usado só se, por algum motivo, o Azure Blob Storage configurado
# abaixo não estiver disponível. Na prática, os campos de imagem/arquivo
# usam o contêiner do Azure Blob (ver media_libraries mais abaixo).
media_folder: "public/uploads"
public_folder: "/uploads"

# Envia fotos e PDFs direto para o Azure Blob Storage em vez do repositório
# do GitHub. Na primeira vez que alguém enviar um arquivo, o painel pede um
# token de SAS do contêiner — gerado uma única vez no Portal Azure (ver
# README, seção "Azure Blob Storage (mídia)") e colado ali; ele fica salvo
# só no navegador de quem publicou, nunca no código nem no repositório.
media_libraries:
  azure_blob_storage:
    account_name: storageigrejaportal
    container: imagens

collections:
  - name: "noticias"
    label: "Notícias e Avisos"
    label_singular: "Notícia"
    description: "Comunicados, avisos e notícias publicados no site."
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    format: "frontmatter"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - {
          label: "Data",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "DD/MM/YYYY",
          time_format: false,
          picker_utc: true,
        }
      - {
          label: "Foto de Capa",
          name: "cover",
          widget: "image",
          required: false,
          hint: "Aparece no topo da notícia. Deixe em branco se não houver foto.",
        }
      - {
          label: "Resumo",
          name: "excerpt",
          widget: "text",
          hint: "Um ou dois parágrafos curtos, aparece na listagem e no compartilhamento.",
        }
      - {
          label: "Corpo",
          name: "body",
          widget: "markdown",
          hint: "Texto principal da notícia. Use o botão de imagem na barra de ferramentas para intercalar fotos no meio do texto.",
        }

  - name: "relatorios"
    label: "Prestação de Contas"
    label_singular: "Relatório"
    description: "Relatórios e balancetes financeiros publicados para a congregação."
    folder: "src/content/relatorios"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - {
          label: "Período/Trimestre",
          name: "period",
          widget: "string",
          hint: "Ex.: \"1º Trimestre de 2026\" ou \"Janeiro a Março de 2026\".",
        }
      - {
          label: "Data",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "DD/MM/YYYY",
          time_format: false,
          picker_utc: true,
        }
      - { label: "Resumo", name: "excerpt", widget: "text", required: false }
      - {
          label: "Anexo (PDF)",
          name: "file",
          widget: "file",
          hint: "Envie o arquivo PDF do relatório ou balancete.",
        }

  - name: "ministerios"
    label: "Ministérios"
    description: "Lista de ministérios e departamentos exibida em /ministerios/."
    files:
      - name: "lista"
        label: "Lista de ministérios"
        file: "src/data/ministerios.yml"
        fields:
          - label: "Ministérios"
            name: "ministerios"
            widget: "list"
            label_singular: "Ministério"
            summary: "{{name}}"
            fields:
              - { label: "Nome", name: "name", widget: "string" }
              - { label: "Descrição", name: "description", widget: "text" }

  - name: "eventos"
    label: "Eventos"
    description: "Agenda de cultos e eventos exibida em /eventos/."
    files:
      - name: "lista"
        label: "Lista de eventos"
        file: "src/data/eventos.yml"
        fields:
          - label: "Eventos"
            name: "eventos"
            widget: "list"
            label_singular: "Evento"
            summary: "{{title}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - {
                  label: "Quando",
                  name: "date",
                  widget: "string",
                  hint: "Texto livre, ex.: \"Todo domingo, 18h\".",
                }
              - { label: "Descrição", name: "description", widget: "text" }

  - name: "galeria"
    label: "Galeria"
    description: "Fotos exibidas em /galeria/."
    files:
      - name: "lista"
        label: "Fotos da galeria"
        file: "src/data/galeria.yml"
        fields:
          - label: "Fotos"
            name: "fotos"
            widget: "list"
            label_singular: "Foto"
            summary: "{{alt}}"
            fields:
              - { label: "Foto", name: "src", widget: "image" }
              - {
                  label: "Descrição da foto",
                  name: "alt",
                  widget: "string",
                  hint: "Texto curto descrevendo a foto (acessibilidade).",
                }
              - { label: "Legenda", name: "caption", widget: "string", required: false }
