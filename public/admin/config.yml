backend:
  name: github
  repo: IEADESPA/site
  branch: main
  # Precisa ser a origem completa (protocolo + domínio, sem caminho) — o Decap
  # exige isso para conferir a mensagem que volta do popup de login. Se algum
  # dia trocar de domínio, atualize esta linha e a "Authorization callback
  # URL" do OAuth App no GitHub para o novo domínio + "/api/callback".
  base_url: https://salmon-bay-0efd06d0f.3.azurestaticapps.net
  auth_endpoint: api/auth

locale: "pt"

# Mantido como referência/fallback, mas os campos de imagem e arquivo abaixo
# usam a biblioteca de mídia customizada "azure-blob" (ver public/admin/index.html),
# que envia os arquivos direto para o Azure Blob Storage em vez de aqui.
media_folder: "public/uploads"
public_folder: "/uploads"

media_library:
  name: azure-blob

collections:
  - name: "noticias"
    label: "Notícias e Avisos"
    label_singular: "Notícia"
    description: "Comunicados, avisos e notícias publicados no site."
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    format: "frontmatter"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - {
          label: "Data",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "DD/MM/YYYY",
          time_format: false,
          picker_utc: true,
        }
      - {
          label: "Foto de Capa",
          name: "cover",
          widget: "image",
          required: false,
          hint: "Aparece no topo da notícia. Deixe em branco se não houver foto.",
          media_library: { name: "azure-blob", config: { container: "imagens" } },
        }
      - {
          label: "Resumo",
          name: "excerpt",
          widget: "text",
          hint: "Um ou dois parágrafos curtos, aparece na listagem e no compartilhamento.",
        }
      - {
          label: "Corpo",
          name: "body",
          widget: "markdown",
          hint: "Texto principal da notícia. Use o botão de imagem na barra de ferramentas para intercalar fotos no meio do texto.",
          media_library: { name: "azure-blob", config: { container: "imagens" } },
        }

  - name: "relatorios"
    label: "Prestação de Contas"
    label_singular: "Relatório"
    description: "Relatórios e balancetes financeiros publicados para a congregação."
    folder: "src/content/relatorios"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - {
          label: "Período/Trimestre",
          name: "period",
          widget: "string",
          hint: "Ex.: \"1º Trimestre de 2026\" ou \"Janeiro a Março de 2026\".",
        }
      - {
          label: "Data",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "DD/MM/YYYY",
          time_format: false,
          picker_utc: true,
        }
      - { label: "Resumo", name: "excerpt", widget: "text", required: false }
      - {
          label: "Anexo (PDF)",
          name: "file",
          widget: "file",
          hint: "Envie o arquivo PDF do relatório ou balancete.",
          media_library: { name: "azure-blob", config: { container: "relatorios" } },
        }
