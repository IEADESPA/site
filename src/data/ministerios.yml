ministerios:
  - name: "Ministério de Louvor e Adoração"
    description: "Conduz a igreja em momentos de louvor e adoração nos cultos, reunindo músicos e vocalistas."
  - name: "Ministério Infantil"
    description: "Cuida do ensino bíblico e da recreação das crianças durante os cultos e eventos especiais."
  - name: "Ministério de Jovens"
    description: "Reúne os jovens da igreja para comunhão, estudo bíblico e atividades voltadas para essa fase da vida."
  - name: "Ministério de Casais"
    description: "Fortalece os casamentos por meio de encontros, aconselhamento e estudos sobre família."
  - name: "Ministério de Evangelismo e Missões"
    description: "Organiza ações evangelísticas na cidade e apoia projetos missionários dentro e fora do Brasil."
  - name: "Ministério de Ação Social"
    description: "Desenvolve campanhas de doação, visitas e apoio a famílias em situação de necessidade."
  - name: "Ministério de Diaconia"
    description: "Auxilia na organização prática dos cultos e no acolhimento de visitantes e membros."
  - name: "Ministério de Ensino"
    description: "Responsável pela Escola Bíblica Dominical e por cursos de formação de discípulos."
